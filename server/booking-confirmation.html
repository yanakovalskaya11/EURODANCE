<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Танцевальная студия — Уведомление</title>
</head>
<body style="margin: 0; padding: 0; background-color: #120018; font-family: Arial, sans-serif; color: #ffffff;">

  <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: auto; background-color: #1a0020; border: 1px solid rgba(210, 0, 163, 0.2); box-shadow: 0 0 30px rgba(210, 0, 163, 0.3); border-radius: 10px; overflow: hidden;">
    
    <!-- Header -->
    <tr>
      <td style="background: rgba(18, 0, 24, 0.95); padding: 20px; text-align: center; border-bottom: 1px solid rgba(210, 0, 163, 0.2);">
      
        <h1 style="margin: 10px 0 0; font-family: 'Bebas Neue', sans-serif; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; background: linear-gradient(90deg, #d200a3, #0061bf); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">EURODANCE</h1>
      </td>
    </tr>

    <!-- Content -->
    <tr>
      <td style="padding: 30px 20px; background-color: #1a0020;">
        <p style="font-size: 16px; line-height: 1.6;">Здравствуйте, <strong>{{username}}</strong>!</p>
        <p style="font-size: 16px; line-height: 1.6;">{{message}}</p>

        <!-- Call to action -->
        <!-- <div style="text-align: center; margin: 30px 0;">
          <a href="{{cta_link}}" style="background: linear-gradient(90deg, #d200a3, #0061bf); color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 30px; display: inline-block; font-weight: bold; box-shadow: 0 0 10px rgba(210, 0, 163, 0.5);">
            {{cta_text}}
          </a>
        </div> -->

        <p style="font-size: 14px; color: #bbbbbb;">Если у вас возникли вопросы, просто ответьте на это письмо или напишите на <a href="mailto:eurodanceminsk@gmail.com" style="color: #d200a3;">support@dance-studio.ru</a>.</p>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="padding: 15px; text-align: center; font-size: 12px; color: #888; background-color: #100017; border-top: 1px solid rgba(210, 0, 163, 0.2);">
        © 2025 EURODANCE. Все права защищены.
      </td>
    </tr>
  </table>
</body>
</html>
